# Check, build and test Hello on every PR and on main.
#
# Runners: this repo is public, so CI runs on GitHub-hosted runners, like the
# other public add-on repos (APS 11 as Sami amended it, 10-12 Nov: ordinary CI
# of a public repo may run there). There's no publish job: the catalogue
# (avacanada/ava-catalogue) builds Hello from a pinned commit, signs it and
# publishes it (see README.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # No install scripts: nothing here needs one, and the catalogue builds
      # add-ons the same way.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      # After the build: test/bundle.test.ts checks the bundle itself.
      - run: npm test
